services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "local-docker-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      OSRM_BASE_URL: "https://router.project-osrm.org"
      GEOCODER_BASE_URL: "https://nominatim.openstreetmap.org"
      GEOCODER_USER_AGENT: "FuelRouteOptimizer/1.0 (assessment demo)"
      FUEL_MPG: "10"
      MAX_RANGE_MILES: "500"
      STATION_CORRIDOR_MILES: "20"
      INITIAL_FUEL_GALLONS: "50"
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
